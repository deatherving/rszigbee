name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features
      # Doc examples are part of the public API surface; they must not rot.
      - run: cargo test --workspace --all-features --doc
      # A broken intra-doc link is a broken promise in the API documentation.
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The boundaries only hold if they hold in every feature combination.
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings

  boundaries:
    name: architectural boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-boundaries.sh

  fuzz:
    name: fuzz the codecs (non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking on purpose. A fuzzer finding something is a real bug and
    # should be looked at, but it is a *search*: a run that happens to explore
    # further than the last one must not turn an unrelated pull request red.
    # The stable, deterministic counterpart in rszigbee-spec's tests does gate
    # the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Stable, like everything else here.
      #
      # `cargo fuzz` defaults to AddressSanitizer, which needs `-Z sanitizer`
      # and therefore nightly. `--sanitizer none` drops it and builds on
      # stable. That costs very little: these crates are pure Rust and forbid
      # `unsafe`, so memory safety is already the compiler's guarantee and
      # ASan has almost nothing to find. What the fuzzer is actually hunting
      # is panics and hangs on malformed input -- the lints forbid panicking
      # on bytes from a device -- and libFuzzer finds those either way.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz
      # Short runs: enough to catch a regression that crashes immediately,
      # which is what a CI fuzz pass can honestly claim. Finding deep bugs
      # takes hours and belongs in a dedicated run, not on every push.
      - run: cargo fuzz run zcl --sanitizer none -- -max_total_time=60
      - run: cargo fuzz run zdo --sanitizer none -- -max_total_time=60
      - run: cargo fuzz run tuya --sanitizer none -- -max_total_time=60

  licenses:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo check --workspace --all-features
