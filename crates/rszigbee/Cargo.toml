[package]
name = "rszigbee"
description = "A Rust-native Zigbee stack: typed embedded API and a Zigbee2MQTT-compatible gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["zigbee", "zigbee2mqtt", "home-automation", "iot"]
categories = ["network-programming", "embedded"]
readme = "../../README.md"

# The one crate users depend on. Everything below it is an implementation
# detail of the architecture, not of the API.
[dependencies]
rszigbee-core.workspace = true
rszigbee-adapter.workspace = true
rszigbee-spec.workspace = true
rszigbee-adapter-ember = { workspace = true, optional = true }

[features]
# Ember (EZSP over ASHv2) is the default coordinator family: largest installed
# base among new setups, and no firmware reflash, so a migration keeps the
# existing network.
default = ["ember"]
ember = ["dep:rszigbee-adapter-ember"]

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
