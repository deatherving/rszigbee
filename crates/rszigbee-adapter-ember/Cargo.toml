[package]
name = "rszigbee-adapter-ember"
description = "Silicon Labs EmberZNet (EZSP over ASHv2) coordinator adapter for rszigbee."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["zigbee", "ezsp", "ember", "silabs"]
categories = ["network-programming"]

[dependencies]
rszigbee-spec.workspace = true
rszigbee-adapter.workspace = true
rsezsp.workspace = true
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "io-util"] }

getrandom = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
