[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway probes against real hardware, excluded so a broken or
# fast-moving upstream dependency can never break `cargo test --workspace` and
# so nothing in the published crates can accidentally depend on one. Listing a
# path in `members` overrides `exclude`, so it must appear in only one of them —
# it was in both, which silently made the exclusion do nothing.
exclude = ["spikes/ezsp-probe"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deatherving/rszigbee"
authors = ["The rszigbee contributors"]

[workspace.dependencies]
rszigbee-spec = { path = "crates/rszigbee-spec", version = "0.0.1" }
rszigbee-adapter = { path = "crates/rszigbee-adapter", version = "0.0.1" }
rszigbee-core = { path = "crates/rszigbee-core", version = "0.0.1" }
rszigbee-devices = { path = "crates/rszigbee-devices", version = "0.0.1", default-features = false }
rszigbee-adapter-ember = { path = "crates/rszigbee-adapter-ember", version = "0.0.1" }

thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }
tokio = { version = "1", default-features = false }
serde = { version = "1", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The parse-path invariant (see the README design notes): a malformed
# frame from the radio must never take the process down. These four lints are
# what enforce it; `clippy.toml` relaxes them inside tests, where asserting on
# `decode(..).unwrap()` is how the invariant gets checked.
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Deliberately NOT enabled: `arithmetic_side_effects`. It fires on provably
# bounded arithmetic inside match arms (`0x08..=0x0f => Data(id - 0x08 + 1)`),
# and satisfying it there means writing `saturating_sub`/`saturating_add` around
# expressions that cannot overflow — worse code for no gain. Overflow safety in
# release builds is covered by the profile setting below plus fuzzing.

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Arithmetic overflow is a bug in a protocol decoder, not a wrapping operation
# to be relied on. Keep the debug behaviour in release too: a panic here is
# loud and reportable, a silent wrap corrupts a device's state invisibly.
[profile.release]
overflow-checks = true

# Local patch of `ezsp` 17.0.0, one file changed. Its `importTransientKey`
# frame declares a 17-byte `Context` field that EZSP v13 does not carry, so the
# command went on the wire 47 bytes long where the correct frame is 30. The NCP
# answers OK on the misparse, installing a key spliced out of the wrong bytes,
# and a Zigbee 3.0 device can then never finish commissioning. See
# vendor/ezsp/README.md for the wire evidence. 17.0.0 is the newest release, so
# there is nothing to upgrade to; this goes away when the fix is upstreamed.
[patch.crates-io]
ezsp = { path = "vendor/ezsp" }
